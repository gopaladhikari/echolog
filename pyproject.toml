[project]
name = "echolog"
version = "1.0.0"
description = "EchoLog is a meticulously structured REST API that transforms daily journaling into actionable insights."
readme = "README.md"
authors = [{ name = "gopaladhikari", email = "hello@gopuadks.dev" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "sqlmodel>=0.0.39",
    "email-validator>=2.0.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "resend>=2.43.0",
]

[project.scripts]
echolog = "echolog:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"


[tool.fastapi]
entrypoint = "echolog.main:app"
