[project]
name = "echolog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "gopaladhikari", email = "hello@gopuadks.dev" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "passlib>=1.7.4",
    "sqlmodel>=0.0.39",
]

[project.scripts]
echolog = "echolog:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"


[tool.fastapi]
entrypoint = "echolog.main:app"
